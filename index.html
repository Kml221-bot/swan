<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swan Scent Parfumerie</title>
<meta name="theme-color" content="#04190F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#04190F; --green2:#0A2E20; --gold:#C9B077; --gold-l:#E9D9A6; --gold-d:#9C8650;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    min-height:100dvh; background:var(--green); color:var(--gold);
    font-family:'Montserrat',sans-serif; overflow-x:hidden;
    display:flex; align-items:center; justify-content:center;
    -webkit-tap-highlight-color:transparent;
  }
  /* fond : halo + motif arabesque très léger */
  .bg{position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(ellipse 70% 50% at 50% 30%, rgba(201,176,119,.13), transparent 70%),
      radial-gradient(ellipse 90% 60% at 50% 110%, #0C3A28 0%, transparent 60%),
      var(--green);}
  .ripple{position:fixed;left:50%;top:34%;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;
    border:1px solid rgba(201,176,119,.35);z-index:0;pointer-events:none;opacity:0;
    animation:ripple 6s cubic-bezier(.2,.6,.3,1) infinite}
  .ripple:nth-child(3){animation-delay:2s}.ripple:nth-child(4){animation-delay:4s}
  @keyframes ripple{0%{transform:scale(.6);opacity:0}15%{opacity:.6}100%{transform:scale(7);opacity:0}}
  canvas#sparks{position:fixed;inset:0;z-index:1;pointer-events:none}

  .frame{position:fixed;inset:14px;border:1px solid rgba(201,176,119,.28);z-index:1;pointer-events:none;
    opacity:0;animation:fade 1.4s .2s ease forwards}
  .frame::before,.frame::after{content:"";position:absolute;width:26px;height:26px;border:1px solid var(--gold)}
  .frame::before{top:-5px;left:-5px;border-right:0;border-bottom:0}
  .frame::after{bottom:-5px;right:-5px;border-left:0;border-top:0}

  main{position:relative;z-index:2;width:100%;max-width:460px;padding:56px 28px 40px;text-align:center}

  .swan{width:min(46vw,190px);margin:0 auto;display:block;
    filter:drop-shadow(0 10px 30px rgba(201,176,119,.25));
    opacity:0;transform:translateY(24px) scale(.94);
    animation:rise 1.4s .35s cubic-bezier(.2,.8,.2,1) forwards, float 6s 1.8s ease-in-out infinite, glow 5s 2s ease-in-out infinite}
  @keyframes glow{0%,100%{filter:drop-shadow(0 10px 30px rgba(201,176,119,.2)) brightness(1)}50%{filter:drop-shadow(0 10px 40px rgba(233,217,166,.45)) brightness(1.15)}}
  .shine{position:relative;display:inline-block;overflow:hidden}
  .shine::after{content:"";position:absolute;inset:-20% -60%;
    background:linear-gradient(105deg,transparent 42%,rgba(255,246,214,.55) 50%,transparent 58%);
    transform:translateX(-100%);animation:sweep 5s 2.2s ease-in-out infinite;mix-blend-mode:overlay}
  .word{width:min(78vw,330px);margin:26px auto 0;display:block;opacity:0;
    animation:fade 1.2s 1s ease forwards}

  .line{height:1px;width:0;margin:26px auto 22px;background:linear-gradient(90deg,transparent,var(--gold),transparent);
    animation:grow 1.2s 1.4s ease forwards}
  .tag{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.15rem;line-height:1.35;color:var(--gold-l);
    letter-spacing:.02em;opacity:0;animation:fade 1s 1.7s ease forwards}

  .socials{display:flex;justify-content:center;gap:clamp(14px,5vw,26px);margin-top:38px}
  .s{display:flex;flex-direction:column;align-items:center;gap:12px;text-decoration:none;color:var(--gold);
    opacity:0;transform:translateY(18px);animation:pop .9s cubic-bezier(.2,.9,.25,1.2) forwards}
  .s:nth-child(1){animation-delay:2s}.s:nth-child(2){animation-delay:2.18s}.s:nth-child(3){animation-delay:2.36s}
  .medal{position:relative;width:clamp(74px,22vw,88px);aspect-ratio:1;border-radius:50%;
    display:grid;place-items:center;
    background:radial-gradient(circle at 30% 25%,#123D2B,#06231A 70%);
    border:1px solid rgba(201,176,119,.55);
    box-shadow:0 8px 24px rgba(0,0,0,.35), inset 0 0 0 5px rgba(4,25,15,.9), inset 0 0 0 6px rgba(201,176,119,.22);
    transition:transform .4s cubic-bezier(.2,.9,.25,1.3), box-shadow .4s, border-color .4s}
  .medal::before{content:"";position:absolute;inset:-7px;border-radius:50%;
    border:1px dashed rgba(201,176,119,.35);animation:spin 22s linear infinite}
  .medal svg{width:42%;height:42%;transition:transform .4s, color .4s}
  .s .lbl{font-size:.66rem;letter-spacing:.28em;text-transform:uppercase;font-weight:500}
  .s .hdl{font-family:'Cormorant Garamond',serif;font-size:.98rem;color:var(--gold-l);margin-top:-6px;opacity:.85}
  .s:hover .medal,.s:focus-visible .medal{transform:translateY(-6px) scale(1.06);border-color:var(--gold-l);
    box-shadow:0 14px 34px rgba(201,176,119,.28), inset 0 0 0 5px rgba(4,25,15,.9), inset 0 0 0 6px rgba(201,176,119,.45)}
  .s:active .medal{transform:scale(.94)}
  .s:focus-visible{outline:none}
  .s.ig:hover svg{color:#F2A2C8}.s.tt:hover svg{color:#E9F7F7}.s.wa:hover svg{color:#7EE0A4}

  footer{margin-top:46px;font-size:.62rem;letter-spacing:.32em;text-transform:uppercase;color:var(--gold-d);
    opacity:0;animation:fade 1s 2.8s ease forwards}
  footer span{display:block;margin-top:10px;letter-spacing:.03em;font-family:'Cormorant Garamond',serif;
    text-transform:none;font-size:.95rem;font-style:italic;color:var(--gold)}

  /* voile d'ouverture */
  .veil{position:fixed;inset:0;z-index:5;background:var(--green);display:grid;place-items:center;
    animation:veil 1s .15s cubic-bezier(.7,0,.3,1) forwards;pointer-events:none}
  .veil i{width:1px;height:0;background:var(--gold);animation:drop .6s ease forwards}

  @keyframes veil{to{clip-path:inset(0 0 100% 0)}}
  @keyframes drop{to{height:80px}}
  @keyframes fade{to{opacity:1}}
  @keyframes grow{to{width:160px}}
  @keyframes rise{to{opacity:1;transform:none}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @keyframes pop{to{opacity:1;transform:none}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes sweep{0%,60%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div class="veil"><i></i></div>
<div class="bg"></div>
<div class="ripple"></div><div class="ripple"></div><div class="ripple"></div>
<canvas id="sparks"></canvas>
<div class="frame"></div>

<script>
(()=>{
  const c=document.getElementById('sparks'),x=c.getContext('2d');
  let W,H,P=[];const dpr=Math.min(window.devicePixelRatio||1,2);
  const rs=()=>{W=c.width=innerWidth*dpr;H=c.height=innerHeight*dpr;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px'};
  rs();addEventListener('resize',rs);
  const n=Math.round(Math.min(46,innerWidth/9));
  const mk=(y)=>({x:Math.random()*W,y:y??H+Math.random()*H*.3,r:(Math.random()*1.6+.4)*dpr,
    v:(Math.random()*.35+.12)*dpr,d:Math.random()*Math.PI*2,a:Math.random()*.6+.25});
  for(let i=0;i<n;i++)P.push(mk(Math.random()*H));
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  (function f(t){
    x.clearRect(0,0,W,H);
    for(const p of P){
      p.y-=p.v;p.d+=.01;p.x+=Math.sin(p.d)*.25*dpr;
      const tw=p.a*(.6+.4*Math.sin(t/600+p.d*3));
      x.beginPath();x.arc(p.x,p.y,p.r,0,7);
      x.fillStyle=`rgba(233,217,166,${tw})`;x.shadowColor='rgba(233,217,166,.9)';x.shadowBlur=8*dpr;x.fill();
      if(p.y<-10)Object.assign(p,mk());
    }
    requestAnimationFrame(f);
  })(0);
})();
</script>
